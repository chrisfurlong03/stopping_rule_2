[project]
name = "stopping-rule-2"
version = "0.1.0"
description = "Woreda-level rainy-season onset stopping rule (AIFS + CHIRPS dry-spell detector)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "h5netcdf>=1.8.3",
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "xarray>=2026.9.0",
]

[project.scripts]
stopping-rule-2 = "stopping_rule_2:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
